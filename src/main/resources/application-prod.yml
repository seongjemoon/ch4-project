server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: ch4-project
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  cloud:
    aws:
      region:
        static: ap-southeast-2
      s3:
        region: ap-southeast-2
  config:
    import: aws-parameterstore:/config/ch4-project/

app:
  s3:
    bucket: ${APP_S3_BUCKET}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true