server:
  port: 8080
  address: 0.0.0.0

spring:
  cloud:
    aws:
      region:
        static: ap-southeast-2
  config:
    import: optional:aws-parameterstore:/config/ch4-project/
  jackson:
    serialization:
      indent-output: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true