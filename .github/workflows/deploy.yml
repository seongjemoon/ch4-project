name: deploy

on:
  push:
    branches: [ master ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: |
          chmod +x gradlew
          ./gradlew build

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest

      - uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest
            sudo docker rm -f ch4-project || true
            sudo docker run -d --name ch4-project -p 8080:8080 --restart unless-stopped \
              -e SPRING_PROFILES_ACTIVE=prod \
              -e AWS_REGION=ap-southeast-2 \
              -e APP_S3_BUCKET='${{ secrets.APP_S3_BUCKET }}' \
              -e SPRING_DATASOURCE_URL='${{ secrets.DB_URL }}' \
              -e SPRING_DATASOURCE_USERNAME='${{ secrets.DB_USERNAME }}' \
              -e SPRING_DATASOURCE_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              -e SPRING_JPA_HIBERNATE_DDL_AUTO=update \
              ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest

            for i in $(seq 1 30); do
              curl -fsS localhost:8080/actuator/health >/dev/null 2>&1 && exit 0
              sleep 2
            done
            sudo docker logs --tail 50 ch4-project
            exit 1
