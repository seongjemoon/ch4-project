name: deploy

on:
  push:
    branches: [ master ]

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      # CI
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build & Test
        run: |
          chmod +x gradlew
          ./gradlew build

      # CD (Docker Hub)
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest

      # EC2 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest
            sudo docker stop ch4-project || true
            sudo docker rm ch4-project || true
            sudo docker run -d --name ch4-project -p 8080:8080 \
              -e AWS_REGION=ap-southeast-2 \
              ${{ secrets.DOCKERHUB_USERNAME }}/ch4-project:latest